# Typecheck and build on every push. The package has no runtime dependencies
# and no test suite of its own — what can break is the type surface and the
# build, so that is what runs. The service it talks to has its own tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
